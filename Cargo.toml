[workspace]
resolver = "2"

members = [
    "compiler/zenith-lexer",
    "compiler/zenith-parser", 
    "compiler/zenith-sema",
    "compiler/zenith-hir",
    "compiler/zenith-mir",
#    "compiler/zenith-codegen",
    "runtime",
    "stdlib",
    "tools/zenith",
    "ui/desktop",
    "ui/renderer",
]

[workspace.dependencies]
# Compiler dependencies
zenith-lexer = { path = "compiler/zenith-lexer" }
zenith-parser = { path = "compiler/zenith-parser" }
zenith-sema = { path = "compiler/zenith-sema" }
zenith-hir = { path = "compiler/zenith-hir" }
zenith-mir = { path = "compiler/zenith-mir" }
zenith-codegen = { path = "compiler/zenith-codegen" }

# Runtime dependencies
zenith-runtime = { path = "runtime" }
zenith-stdlib = { path = "stdlib" }

# UI dependencies
zenith-desktop = { path = "ui/desktop" }

# Tool dependencies
zenith = { path = "tools/zenith" }

# External dependencies
llvm-sys = "180"
inkwell = "0.5"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
colored = "2.0"
regex = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# UI dependencies
winit = "0.29"
egui = "0.26"
eframe = { version = "0.26", default-features = false }
taffy = "0.3"
cssparser = "0.33"
html5ever = "0.26"

# Platform dependencies
winapi = { version = "0.3", features = ["full"] }
gtk = { version = "0.17", features = ["v3_24"] }
glib = "0.17"
gio = "0.17"

# Web dependencies
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
