[package]
name = "zenith-runtime"
version = "1.0.0"
edition = "2021"
description = "Zenith programming language runtime system"
authors = ["Zenith Team <team@zenith-lang.org>"]
license = "MIT"
repository = "https://github.com/zenith-lang/zenith"
homepage = "https://zenith-lang.org"
keywords = ["zenith", "runtime", "programming-language", "vm"]
categories = ["development-tools", "compilers"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zenith-lexer = { path = "../compiler/zenith-lexer" }
zenith-parser = { path = "../compiler/zenith-parser" }
zenith-stdlib = { path = "../stdlib" }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "zenith-runtime"
path = "src/main.rs"

[lib]
name = "zenith_runtime"
path = "src/lib.rs"

[features]
default = ["gc"]
gc = []
jit = []
debug = []
