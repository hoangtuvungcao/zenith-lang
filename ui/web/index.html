<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Web Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        canvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            max-height: 100%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
        }
    </style>

    <link data-trunk rel="rust" data-wasm-opt="z" href="." />
</head>

<body>
    <div class="canvas-container">
        <canvas id="zenith-canvas"></canvas>
    </div>
    <div class="loading" id="loading-text">Loading WebAssembly...</div>

    <script>
        const observer = new MutationObserver((mutations) => {
            document.getElementById('loading-text').style.display = 'none';
        });
        observer.observe(document.getElementById('zenith-canvas'), { attributes: true });
    </script>
</body>

</html>
