[package]
name = "zenith-web"
version = "0.1.0"
edition = "2021"
description = "Zenith Web/WASM Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenith-runtime = { path = "../../runtime" }
zenith-lexer = { path = "../../compiler/zenith-lexer" }
zenith-parser = { path = "../../compiler/zenith-parser" }
zenith-sema = { path = "../../compiler/zenith-sema" }
zenith-hir = { path = "../../compiler/zenith-hir" }
zenith-mir = { path = "../../compiler/zenith-mir" }
zenith-ui-renderer = { path = "../../ui/renderer" }

egui = "0.26"
eframe = { version = "0.26", default-features = false, features = ["glow"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
