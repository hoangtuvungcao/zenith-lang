[package]
name = "zenith-ui-android"
version = "1.0.0"
edition = "2021"

[dependencies]
egui = "0.26"
eframe = { version = "0.26", default-features = false, features = ["glow", "android-game-activity"] }
zenith-runtime = { path = "../../runtime" }
zenith-ui-renderer = { path = "../../ui/renderer" }

[lib]
crate-type = ["cdylib"]

[package.metadata.android]
package = "com.zenith.app"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33
